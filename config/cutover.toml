# crown-indexer — cutover-профиль: **только для тестов**.
#
# Побайтово равен `testnet.toml`, кроме `cutover_slot`. Существует затем, чтобы
# `AfterCutover` — механизм №1 передачи поколения (`00-architecture §8`) — был
# покрыт настоящей сборкой, а не впервые сработал в проде на канистре, которую
# уже нельзя починить. При `cutover_slot = 0` во всех рабочих профилях эта ветка
# иначе мертва в любой собираемой конфигурации.
#
# Ничего сетевого в коде: значения только здесь.

# Профиль-уровень (замораживаемые, пиннятся cost-gate с запасом).
# Outcall'ы идут в тот же IC по той же цене, что и на mainnet, поэтому размерные
# константы здесь совпадают с mainnet-профилем — devnet не дешевле.
ingest_price       = 17_000_000_000       # циклы (≈$0.0232), ≥ цены outcall + резерв
min_gross          = 200_000              # $0.20 в minor units (USDC 6 знаков)
cycle_floor        = 1_000_000_000_000    # пол баланса циклов

# Размер outcall'а; `build.rs` проверяет согласованность (см. mainnet-профиль).
rpc_nodes          = 34                   # размер подсети SOL RPC-канистры (fiduciary)
rpc_providers      = 5                    # опрашиваемых провайдеров (платим за всех)
rpc_request_bytes  = 1_000                # верхняя оценка тела запроса
response_max_bytes = 32_768               # кэп ответа getTransaction (инвариант #1)
attach_cycles      = 15_000_000_000       # ≥ 2× измеренной цены SOL RPC, ≤ ingest_price − резерв
# Асимметрия недобора и перебора. Недобор фатален и **тих**: SOL RPC-канистра
# отвечает `Consistent(Err(TooFewCycles))`, что приезжает сюда обычным нечитаемым
# ответом, — каждая впись удерживает оплату и падает, навсегда и без отличимого
# сигнала: книга просто перестаёт двигаться. Перебор не стоит ничего:
# IC возвращает всё, что вызываемый не принял, а `EXECUTION_RESERVE` в `config.rs`
# держит инвариант #1 даже если бы тот принял всё. Поэтому модель — нижняя граница
# с запасом, а не цель, около которой надо сидеть. Авторитетное число даёт
# бесплатный `getTransactionCyclesCost` самой канистры; cost-gate (P8) пиннит
# `attach_cycles` по нему, а модель здесь лишь ловит несогласованный конфиг на
# сборке. `build.rs` требует `2·worst_case ≤ attach_cycles ≤ ingest_price − 1e9`.
#
# `rpc_providers` — не только вход модели: индекс шлёт его как `total` в
# `ConsensusStrategy::Threshold`, то есть спрашивает ровно столько провайдеров.
# С `total = null` опрашивался бы дефолтный набор (три), и `consensus = 3` дал бы
# 3-из-3 — нулевую отказоустойчивость. 3-из-5 переживает два отказа. На devnet
# доступно ровно 5 провайдеров (PublicNode только mainnet), на mainnet — 6.

# Бюджета попыток на сигнатуру НЕТ, и это решение, а не пропуск: счётчик попыток
# был бы само-лимитом в permissionless коде — нефинализованная транзакция здесь
# неотличима от нечитаемой, поэтому любой мог бы исчерпать бюджет чужой сигнатуры
# до её финальности и вычеркнуть платёж из книги навсегда. Разбор — в mainnet-профиле.

# Граница поколения (`00-architecture §8`); ноль = границы нет. На devnet
# поколение одно, так что граница выключена; смысл и порядок пиннинга —
# в mainnet-профиле. Здесь она включена — в этом весь профиль: слот 1000 лежит
# между слотом каннед-транзакции e2e до границы (123) и после неё (5000).
cutover_slot = 1000

# Per-chain. Провайдеры выбирает SOL RPC-канистра (не URL здесь); индексер всегда
# использует её `Default`-набор для кластера.
[[chain]]
id        = "devnet"
consensus = 3
splitter  = "DKs2C9dRJSnZsERdD58cUVXMracvVTDS19PWvUz98GrN"
usdc      = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
factories = ["BGVQrwSwkFQspL69DjGBFgKSgL6rutPqgcgEskmi8A4y", "81HsKu3FCjzJvuqb8fWQTD4Khc9qSq98CC7Y967Nfnm9"]
