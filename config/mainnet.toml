# crown-indexer — mainnet-профиль (заморозка P8).
# Ничего сетевого в коде: значения только здесь. Источники — только Default.

# Профиль-уровень (пиннятся cost-gate).
ingest_price       = 13_700_000_000
min_gross          = 200_000
cycle_floor        = 1_000_000_000_000

# Размер outcall'а. `build.rs` считает по этим числам модельный worst-case и
# **проваливает сборку**, если `attach_cycles` его не покрывает или превышает
# `ingest_price` (инвариант #1 машинно, а не на честном слове).
#
# `response_max_bytes` — кэп ответа `getTransaction`. Платим за кэп, не за
# фактический размер, поэтому он не «побольше на всякий случай»: втрое больший
# кэп втрое дороже на **каждой** вписи. 32 KiB — реальный сеттлмент с потолком
# логов Solana (10 000 байт) и ~30 аккаунтами, плюс ~1.5× запаса. Транзакция,
# намеренно раздутая таблицей адресов сверх этого, не влезет — раздувший теряет
# свою же репутацию, а индексу это стоит ровно одной оплаченной вписи, которую
# оплатил он же. Кэп неисправим после заморозки — потому запас, но не втрое.
rpc_nodes          = 34                   # размер подсети SOL RPC-канистры (fiduciary)
rpc_providers      = 5                    # опрашиваемых провайдеров (платим за всех)
rpc_request_bytes  = 1_000                # верхняя оценка тела запроса
response_max_bytes = 32_768               # кэп ответа getTransaction (инвариант #1)
attach_cycles      = 12_000_000_000       # ≥ 2× модели, ≤ ingest_price − резерв исполнения
# Асимметрия недобора и перебора. Недобор фатален и **тих**: SOL RPC-канистра
# отвечает `Consistent(Err(TooFewCycles))`, что приезжает сюда обычным нечитаемым
# ответом, — каждая впись удерживает оплату и падает, навсегда и без отличимого
# сигнала: книга просто перестаёт двигаться. Перебор не стоит ничего:
# IC возвращает всё, что вызываемый не принял, а `EXECUTION_RESERVE` в `config.rs`
# держит инвариант #1 даже если бы тот принял всё. Поэтому модель — нижняя граница
# с запасом, а не цель, около которой надо сидеть. Авторитетное число даёт
# бесплатный `getTransactionCyclesCost` самой канистры; cost-gate (P8) пиннит
# `attach_cycles` по нему, а модель здесь лишь ловит несогласованный конфиг на
# сборке. `build.rs` требует `2·worst_case ≤ attach_cycles ≤ ingest_price − 1e9`.
#
# `rpc_providers` — не только вход модели: индекс шлёт его как `total` в
# `ConsensusStrategy::Threshold`, то есть спрашивает ровно столько провайдеров.
# С `total = null` опрашивался бы дефолтный набор (три), и `consensus = 3` дал бы
# 3-из-3 — нулевую отказоустойчивость. 3-из-5 переживает два отказа. На devnet
# доступно ровно 5 провайдеров (PublicNode только mainnet), на mainnet — 6.

# Бюджета попыток на сигнатуру НЕТ, и это решение, а не пропуск. Провал вписи
# оплату не возвращает (`01-standards §Тесты 4`), но состояние не меняет: сигнатура
# остаётся свободной навсегда. Счётчик попыток был бы само-лимитом в permissionless
# коде — нефинализованная транзакция здесь неотличима от нечитаемой, поэтому любой
# мог бы исчерпать бюджет чужой сигнатуры до её финальности и вычеркнуть платёж из
# книги навсегда, на канистре, которую не починить. Потолок собственных потерь
# платформы стоит там, где её деньги реально уходят, — per-key бюджет релея
# (`crown-relay`, инвариант #6), который не заморожен.

# Граница поколения (`00-architecture §8`): слот, с которого впись — мандат
# **следующего** поколения, а не этого. Транзакция с `slot >= cutover_slot`
# отклоняется (`AfterCutover`) и в книгу не попадает.
#
# Зачем: поколения складываются (репутация аддитивна), а не заменяют друг друга,
# поэтому один и тот же сеттлмент, попавший в оба, удвоит репутацию за цену одной
# вписи. Граница — то, что делает передачу непересекающейся; без неё сложение
# поколений небезопасно.
#
# Ноль = границы нет (единственное поколение). Пиннится на cost-gate вместе с
# прочими замораживаемыми константами и **консервативно**: канистра обязана
# дойти до границы, не заполнив память (см. `docs/spec.md §Ёмкость`), иначе между
# её смертью и границей образуется дыра, которую не закроет ни одно поколение.
cutover_slot = 0

# Per-chain. Провайдеры выбирает SOL RPC-канистра (не URL здесь); индексер всегда
# использует её `Default`-набор для кластера. Консенсус ≥3 провайдера.
[[chain]]
id        = "mainnet"
consensus = 3
splitter  = "PLACEHOLDER_splitter_mainnet"
usdc      = "PLACEHOLDER_usdc_mainnet_mint"
# Одна форма, не две. `stream` в mainnet-периметр не входит: игры под него нет
# (у `subscription` только `docs/` и `e2e/`), а замораживается он навсегда — та же
# цена, что у `payout-table`, удалённой на `P7.6`, при нулевом потребителе. Он же
# был единственным местом, где ломался порядок «рождение раньше расчёта»:
# `release` permissionless и резолвера не требует, поэтому эскроу платил бы, ни
# разу не предъявив пруф рождения. У `two-outcome` расчёт возможен только через
# `claim(settle)` с подписью резолвера, а она существует лишь после материализации
# на пруфе рождения, то есть после вписи рождения (`certified.rs::attribute`).
# Появится потребитель — по `00 §8` это в любом случае новая фабрика и новое
# поколение индекса, ровно как если бы формы здесь и не было (`08-deferred.md`).
factories = ["PLACEHOLDER_factory_two_outcome"]
