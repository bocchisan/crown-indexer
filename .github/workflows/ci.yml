name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Чекаутится в именованный каталог, чтобы соседние репы легли **рядом**,
      # ровно как в дереве разработчика: `Cargo.toml` тянет `crown-reduce` и
      # `crown-factory/derive` по `path = "../…"`, и одиночный чекаут не
      # разрешается вовсе — `cargo` падает на манифесте до первой строки кода.
      # (Приватный сосед потребовал бы PAT в `token:` — дефолтный GITHUB_TOKEN
      # достаёт только собираемый реп.)
      - uses: actions/checkout@v4
        with:
          path: crown-indexer

      # Закон книги: свёртка живёт здесь, а не копией в индексе.
      - uses: actions/checkout@v4
        with:
          repository: bocchisan/crown-reduce
          path: crown-reduce

      # `crown-derive` — единственный шов с фабрикой: пересчёт PDA эскроу при
      # распознавании рождений (`00 §4`).
      - uses: actions/checkout@v4
        with:
          repository: bocchisan/crown-factory
          path: crown-factory

      - name: fmt
        working-directory: crown-indexer
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: crown-indexer
        run: cargo clippy --all-targets -- -D warnings

      # e2e гоняет настоящую IC-реплику и без сервера падает, а не пропускается —
      # то есть без этого шага `cargo test` в CI красный. Версия сервера обязана
      # совпадать с крейтом `pocket-ic` в Cargo.toml (13.0.0).
      - name: pocket-ic server
        run: |
          curl -fsSL https://github.com/dfinity/pocketic/releases/download/13.0.0/pocket-ic-x86_64-linux.gz \
            | gunzip > "$RUNNER_TEMP/pocket-ic"
          chmod +x "$RUNNER_TEMP/pocket-ic"
          "$RUNNER_TEMP/pocket-ic" --version
          echo "POCKET_IC_BIN=$RUNNER_TEMP/pocket-ic" >> "$GITHUB_ENV"

      # e2e собирает wasm индекса **сам** (в т.ч. профилем `cutover`), поэтому цель
      # нужна до тестов, а не только на шаге `.did`.
      - name: wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: test
        working-directory: crown-indexer
        run: cargo test

      # Отдельного шага «собери профиль `cutover`» здесь нет намеренно: его
      # собирает сам `cargo test` — `after_cutover_is_refused_without_spending_the_signature`
      # пересобирает wasm с включённой границей и ставит его в реплику. Шаг,
      # который не может покраснеть раньше другого, хуже отсутствующего (P7.13).

      # Border (01-standards): единственный не-query — платный ingest.
      #
      # Считаем только строки объявления методов внутри блока `service`, а не
      # что попало во всём файле: у `.did` есть комментарии (в том числе
      # кончающиеся словом «query») и строка самого `service : () -> {`, и
      # прежняя версия проверки ловила и то и другое — два ложных срабатывания
      # гасили друг друга, так что проверка проходила по совпадению. Регексп
      # `^[[:space:]]+[a-z_]+[[:space:]]*:.*->` не может совпасть с комментарием:
      # тот начинается с `//`.
      - name: single non-query is ingest
        working-directory: crown-indexer
        run: |
          body="$(sed -n '/^service *: *() *-> *{/,/^}/p' crown-indexer.did)"
          decls="$(printf '%s\n' "$body" | grep -E '^[[:space:]]+[a-z_]+[[:space:]]*:.*->' || true)"
          n="$(printf '%s\n' "$decls" | grep -c . || true)"
          q="$(printf '%s\n' "$decls" | grep -c 'query;[[:space:]]*$' || true)"
          echo "$decls"
          test "$n" -ge 2 || { echo "did not find the service methods — the check itself is broken"; exit 1; }
          test "$((n - q))" -eq 1 || { echo ".did has non-query methods other than ingest"; exit 1; }
          printf '%s\n' "$decls" | grep -qE '^[[:space:]]+ingest[[:space:]]*:.*->[^;]*;[[:space:]]*$' \
            || { echo "the single non-query is not ingest"; exit 1; }

      # Тот же .did обязан совпадать с тем, что реально экспортирует wasm:
      # иначе граница проверяется по файлу, который никто не сверял с кодом.
      - name: .did matches the wasm
        working-directory: crown-indexer
        run: |
          cargo install candid-extractor --locked
          cargo build --lib --release --target wasm32-unknown-unknown
          candid-extractor target/wasm32-unknown-unknown/release/crown_indexer.wasm > /tmp/gen.did
          diff -u crown-indexer.did /tmp/gen.did

      # Прежний линт «mainnet-профиль без Custom-источников» удалён (P7.5): он
      # грепал ключ `source =`, которого в конфиге нет, а `RpcSources` имеет
      # единственную ветку `Default(cluster)` — `Custom` не выразим типом. Линт,
      # который не может покраснеть, хуже отсутствующего: он читается как
      # гарантия, а даёт её тип (`07-build-plan.md §Ключевые DoD`).
